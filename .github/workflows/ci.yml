name: ci

on:
  push:
    branches: [main]
    paths:
      - 'l2l/**'
      - 'tests/**'
      - 'pyproject.toml'
  pull_request:
    paths:
      - 'l2l/**'
      - 'tests/**'
      - 'pyproject.toml'

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - run: python -m pip install -e ".[dev]"
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy
      - run: pytest -q
