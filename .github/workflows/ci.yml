name: ci

on:
  push:
    branches: [main]
    paths:
      - 'l2l/**'
      - 'tools/**'
      - 'tests/**'
      - 'pyproject.toml'
  pull_request:
    paths:
      - 'l2l/**'
      - 'tools/**'
      - 'tests/**'
      - 'pyproject.toml'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv format --check
      - run: uv run ruff check
      - run: uv run mypy l2l tests tools
      - run: uv run pytest -q
