target_language = "English"
source_language = "Chinese"

[api]
base_url = "https://openrouter.ai/api/v1"
model = "z-ai/glm-5.3-flash"
timeout = 120.0
max_tokens = 100000

[api.params]
provider = { allow_fallbacks = true, sort = { by = "throughput" } }
stop = ["END"]

[[pass]]
name = "analyse"
mode = "analysis"
[pass.params]
reasoning.effort = "high"

[[pass]]
name = "translate"
ascii = true
retranslate_untranslated = true
mode = "chunk"
[pass.params]
reasoning.effort = "high"

[[pass]]
name = "review"
ascii = true
retranslate_untranslated = true
mode = "chunk"
[pass.params]
reasoning.effort = "high"
