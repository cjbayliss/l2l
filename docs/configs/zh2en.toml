target_language = "English"
source_language = "Chinese"

[api]
base_url = "https://openrouter.ai/api/v1"
model = "z-ai/glm-5.3-flash"
timeout = 120.0
max_tokens = 100000

[api.params]
provider = { allow_fallbacks = true, sort = { by = "throughput" } }
stop = ["END"]

[pass.analyse]
mode = "analysis"
[pass.analyse.params]
reasoning.effort = "high"

[pass.translate]
ascii = true
retranslate_untranslated = true
mode = "translate"
[pass.translate.params]
reasoning.effort = "high"

[pass.review]
ascii = true
retranslate_untranslated = true
mode = "review"
[pass.review.params]
reasoning.effort = "high"
