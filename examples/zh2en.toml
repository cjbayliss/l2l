[api]
base_url = "https://openrouter.ai/api/v1"
api_key = "sk-..."
model = "z-ai/glm-5.3-flash"
timeout = 120.0
max_tokens = 100000

[api.params]
provider = { allow_fallbacks = true, sort = { by = "throughput" } }
stop = ["END"]

[[pass]]
name = "translate"
ascii = true
ensure_paragraphs = 2
retranslate_untranslated = true
instruction_file = "zh2en.txt"
mode = "chunk"
[pass.params]
reasoning.effort = "high"
