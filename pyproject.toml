[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zh2en"
description = "Translate text between any pair of languages on stdin/stdout using any OpenAI-compatible chat completions endpoint."
requires-python = ">=3.14"
dependencies = []
dynamic = ["version"]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "hypothesis>=6",
]

[project.scripts]
zh2en = "zh2en.cli:cli"

[tool.setuptools]
packages = ["zh2en"]

[tool.setuptools.dynamic]
version = { attr = "zh2en.__version__" }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--cov=zh2en --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
branch = true

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["C4", "E", "F", "PERF", "FURB", "W", "I", "B", "SIM", "RET", "UP"]
ignore = [
    # The package standardises on printf-style formatting.
    "UP031",
    # `IO[None]` thunks keep an explicit `return None` on early exits.
    "RET501",
]

[tool.mypy]
strict = true
python_version = "3.14"
mypy_path = [".", "tests"]
files = ["zh2en", "tests"]
