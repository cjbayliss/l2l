[project]
name = "l2l"
description = "Translate text between any pair of languages on stdin/stdout using any OpenAI-compatible chat completions endpoint."
readme = "README.md"
requires-python = ">=3.15"
version = "0.10.0"
dependencies = ["langcodes[data]>=3.5.1", "pycurl>=7.45.7", "unicodedataplus>=16.0.0"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "pyright>=1.1.414",
    "hypothesis>=6",
    "types-pycurl>=7.45",
]

[project.scripts]
l2l = "l2l.cli:cli"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "--cov=l2l --cov-report=term-missing --cov-fail-under=99"

[tool.coverage.run]
branch = true

[tool.ruff]
line-length = 88
target-version = "py315"

[tool.ruff.lint]
select = [
    "C4",
    "E",
    "F",
    "PERF",
    "FURB",
    "W",
    "I",
    "B",
    "SIM",
    "RET",
    "UP",
    "N",
    "PT",
    "RUF",
    "PLW0602",
    "PLW0603",
    "TC",
    "ANN",
    "PGH",
    "PYI",
]
ignore = [
    # The package translates text; strings legitimately contain fullwidth
    # and lookalike characters.
    "RUF001",
]

# ARG (unused arguments) is deliberately not enabled: argparse actions,
# protocol handlers, and test fakes deliberately keep signature-complete
# parameters.

[tool.ruff.lint.per-file-ignores]
# The run-log handle intentionally outlives `open_run_log`; `close_run_log` closes it.
"src/l2l/effects.py" = ["SIM115"]

[tool.mypy]
strict = true
disallow_any_explicit = true
warn_unreachable = true
enable_error_code = [
    "ignore-without-code",
    "possibly-undefined",
    "redundant-expr",
    "truthy-bool",
    "explicit-override",
    "mutable-override",
    "narrowed-type-not-subtype",
    "unimported-reveal",
    "deprecated",
]
explicit_package_bases = true
python_version = "3.15"
mypy_path = ["src", "tests", "typings"]
files = ["src", "tests", "typings"]
strict_equality = true
extra_checks = true

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.pyright]
include = ["src", "tests", "typings"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.15"
typeCheckingMode = "strict"
reportImplicitOverride = "error"
reportCallInDefaultInitializer = "error"
reportUnnecessaryTypeIgnoreComment = "error"
deprecateTypingAliases = true
