[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zh2en"
description = "Translate Chinese text from stdin to English on stdout."
requires-python = ">=3.14"
dependencies = []
dynamic = ["version"]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
zh2en = "zh2en.cli:cli"

[tool.setuptools]
packages = ["zh2en"]

[tool.setuptools.dynamic]
version = { attr = "zh2en.__version__" }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]

[tool.mypy]
strict = true
python_version = "3.11"
mypy_path = [".", "tests"]
files = ["zh2en", "tests"]
