[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "l2l"
description = "Translate text between any pair of languages on stdin/stdout using any OpenAI-compatible chat completions endpoint."
requires-python = ">=3.14"
dependencies = []
dynamic = ["version"]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "hypothesis>=6",
]

[project.scripts]
l2l = "l2l.cli:cli"

[tool.setuptools]
packages = ["l2l"]

[tool.setuptools.dynamic]
version = { attr = "l2l.__version__" }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--cov=l2l --cov-report=term-missing --cov-fail-under=99"

[tool.coverage.run]
branch = true

[tool.coverage.report]
exclude_lines = ["assert_never", "\\(Protocol\\)"]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["C4", "E", "F", "PERF", "FURB", "W", "I", "B", "SIM", "RET", "UP", "PLW0602", "PLW0603"]
ignore = [
    # The package standardises on printf-style formatting.
    "UP031",
    # `IO[None]` thunks keep an explicit `return None` on early exits.
    "RET501",
]

[tool.ruff.lint.per-file-ignores]
# The run-log handle intentionally outlives `open_run_log`; `close_run_log` closes it.
"l2l/effects.py" = ["SIM115"]

[tool.mypy]
strict = true
warn_unreachable = true
python_version = "3.14"
mypy_path = [".", "tests"]
files = ["l2l", "tests"]
