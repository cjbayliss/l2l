[project]
name = "l2l"
description = "Translate text between any pair of languages on stdin/stdout using any OpenAI-compatible chat completions endpoint."
readme = "README.md"
requires-python = ">=3.14"
version = "0.8.0"
dependencies = ["pycurl>=7.45.7"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "hypothesis>=6",
    "types-pycurl>=7.45",
]

[project.scripts]
l2l = "l2l.cli:cli"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "--cov=l2l --cov=tools --cov-report=term-missing --cov-fail-under=99"

[tool.coverage.run]
branch = true

[tool.coverage.report]
exclude_lines = ["assert_never", "\\(Protocol\\)", "if __name__ == .__main__.:"]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["C4", "E", "F", "PERF", "FURB", "W", "I", "B", "SIM", "RET", "UP", "PLW0602", "PLW0603"]
ignore = [
    # The package standardises on printf-style formatting.
    "UP031",
    # `IO[None]` thunks keep an explicit `return None` on early exits.
    "RET501",
]

[tool.ruff.lint.per-file-ignores]
# The run-log handle intentionally outlives `open_run_log`; `close_run_log` closes it.
"src/l2l/effects.py" = ["SIM115"]

[tool.mypy]
strict = true
warn_unreachable = true
explicit_package_bases = true
python_version = "3.14"
mypy_path = ["src", "tests"]
files = ["src", "tests", "tools"]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
